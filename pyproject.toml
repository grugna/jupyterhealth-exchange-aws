[project]
name = "jhe-aws"
version = "0.1.0"
description = "A representative AWS CDK deployment of JupyterHealth Exchange"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10.4,<11",
    "cdk-nag>=2.36,<3",
    "pydantic>=2.11,<3",
    "boto3>=1.40,<2",
    "cryptography>=45,<51",
]

[project.scripts]
jhe-deploy = "jhe_aws.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jhe_aws"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
